name: Successful merge tasks

on:
  workflow_run:
    workflows: ["Complete integration test"]   # must match CI workflow's name:
    types: [completed]
    branches: [main]
  #pull_request:
  #  types: [closed] # this action only acts once the PR is closed
  #  branches: [main]

jobs:
  on-merge:
    # Only act when the CI run we're reacting to (a) succeeded and (b) was
    # triggered by a push to main, i.e. a merge — not a PR-time run.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read            # to download the artifact from the triggering run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # -----------------------------------------------------------------------
      # Resolve which PR this merge corresponds to.
      # The merge commit's message is "Merge pull request #N ..." for merge
      # strategy; for squash/rebase we match by commit SHA against PR head.
      # Easiest robust way: ask GitHub which PRs are associated with the SHA.
      # -----------------------------------------------------------------------
      - name: Find merged PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # PRs associated with a commit (works for merge, squash, rebase)
          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/commits/${SHA}/pulls" \
            --jq 'map(select(.merged_at != null)) | .[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No merged PR found for commit $SHA; skipping."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "PR #$PR_NUMBER"
          echo "found=true"    >> $GITHUB_OUTPUT
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Download the artifact straight from the triggering CI run.
      # No API lookup needed: github.event.workflow_run.id IS the run id.
      # -----------------------------------------------------------------------
      - name: Download successful CasADi versions artifact
        if: steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: successful-casadi-versions
          path: ci-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve versions for badges
        if: steps.pr.outputs.found == 'true'
        id: versions
        run: |
          VERSIONS=""
          if [ -f ci-artifact/successful_casadi_versions.json ]; then
            VERSIONS=$(jq -c . ci-artifact/successful_casadi_versions.json 2>/dev/null || echo "")
          fi
          [ "$VERSIONS" = "[]" ] && VERSIONS=""
          [ -z "$VERSIONS" ] && VERSIONS='[]'
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Prepend badges to merged PR description
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          VERSIONS: ${{ steps.versions.outputs.versions }}
        run: |
          BADGES=""
          for version in $(echo "$VERSIONS" | jq -r '.[]'); do
            BADGES="${BADGES} ![CasADi ${version}](https://img.shields.io/badge/CasADi-${version}-green)"
          done
          [ -z "$BADGES" ] && { echo "No versions; skip."; exit 0; }
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          NEW_BODY=$(printf '%s\n\n%s' "$BADGES" "$CURRENT_BODY")
          gh pr edit "$PR_NUMBER" --body "$NEW_BODY"